<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101311">
<title>Pénztáram</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<style>
:root{color-scheme:dark;--bg:#0d100e;--panel:#171c19;--panel2:#202722;--line:#2a342d;--text:#f2f6f2;--muted:#9ba89e;--green:#9be870;--red:#ff7777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom));-webkit-tap-highlight-color:transparent}
header{padding:22px 18px 14px;display:flex;justify-content:space-between;align-items:center}
h1{font-size:25px;margin:0;font-weight:800;letter-spacing:-.6px}
.sub{color:var(--muted);font-size:13px;margin-top:5px}
main{max-width:720px;margin:auto;padding:0 14px}
.balance{background:linear-gradient(135deg,#1d2c20,#18211a);border:1px solid #304432;border-radius:24px;padding:22px;margin:6px 0 14px}
.label{color:#b7c6b9;font-size:13px}
.amount{font-size:36px;font-weight:800;letter-spacing:-1px;margin:9px 0 19px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:#111713a8;padding:13px;border-radius:15px}
.stat strong{display:block;font-size:18px;margin-top:7px;font-variant-numeric:tabular-nums}
.green{color:var(--green)}.red{color:var(--red)}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:23px 3px 10px}
.section-head h2{font-size:18px;margin:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.tx{display:flex;align-items:center;gap:12px}
.emoji{width:32px;height:32px;display:grid;place-items:center;background:var(--panel2);border-radius:10px;font-size:16px;flex-shrink:0}
.txinfo{flex:1;min-width:0}
.txinfo strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px}
.txinfo small{display:block;color:var(--muted);margin-top:4px;font-size:12px}
.txamt{font-weight:800;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;font-size:15px}
.txamt small{display:block;margin-top:5px;color:var(--muted);font-weight:500}
.txamt .smallbtn{border:1px solid var(--line);border-radius:8px;background:var(--panel2);color:var(--muted);padding:4px 7px;font-size:11px;font-family:inherit}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:7px 11px;color:var(--muted);background:transparent;font-size:12px;font-family:inherit}
/* FAB */
.fab{position:fixed;right:18px;bottom:calc(24px + env(safe-area-inset-bottom));width:60px;height:60px;border-radius:50%;background:var(--green);color:#10200d;border:0;font-size:30px;font-weight:300;display:grid;place-items:center;box-shadow:0 8px 24px rgba(155,232,112,.35);z-index:6;cursor:pointer;line-height:1;font-family:inherit}
/* Bottom sheet */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:20;display:none;align-items:flex-end;justify-content:center}
.backdrop.show{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:16px 20px calc(22px + env(safe-area-inset-bottom));animation:slideUp .28s cubic-bezier(.2,.8,.3,1);border:1px solid var(--line);border-bottom:0}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:38px;height:4px;background:#3a443c;border-radius:99px;margin:0 auto 18px}
.sheet h2{font-size:16px;margin:0 0 16px;text-align:center;font-weight:700;color:var(--text)}
.type-toggle{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#101512;border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px}
.type-toggle button{background:transparent;border:0;color:var(--muted);padding:10px;border-radius:9px;font:inherit;font-weight:600;font-size:14px;cursor:pointer}
.type-toggle button.active{background:var(--panel2);color:var(--text)}
.type-toggle button.active[data-type="income"]{color:var(--green)}
.type-toggle button.active[data-type="expense"]{color:var(--red)}
.amount-input{width:100%;background:transparent;border:0;color:var(--text);font-size:46px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;padding:10px 0 4px;outline:none;letter-spacing:-1px;-moz-appearance:textfield;appearance:textfield;font-family:inherit}
.amount-input::-webkit-outer-spin-button,.amount-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.amount-suffix{text-align:center;color:var(--muted);font-size:12px;margin-bottom:22px}
/* Category grid */
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.cat-btn{background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 10px;color:var(--text);font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:13.5px;font-weight:600;transition:transform .1s,border-color .15s,background .15s}
.cat-btn:active{transform:scale(.96)}
.cat-btn.selected{border-color:var(--green);background:#1d2c20}
.cat-btn .ico{font-size:22px}
/* Buttons */
.btn{border:0;border-radius:14px;padding:15px;font-weight:700;font-size:15px;background:var(--green);color:#10200d;width:100%;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.35}
.btn.ghost{background:transparent;color:var(--muted);font-weight:500;margin-top:4px;padding:12px}
.summary-line{display:flex;justify-content:space-between;align-items:center;padding:13px 16px;background:#101512;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.summary-line .lbl{color:var(--muted);font-size:13px}
.summary-line .val{font-weight:700;font-variant-numeric:tabular-nums}
#noteInput{width:100%;background:#101512;border:1px solid var(--line);border-radius:12px;color:var(--text);padding:13px;font:inherit;margin:6px 0 16px}
label.small{font-size:13px;color:#c1ccc3}
@media(min-width:600px){.amount{font-size:43px}main{padding:0 22px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Pénztáram <span style="color:var(--green)">.</span></h1>
    <div class="sub" id="today"></div>
  </div>
  <button class="pill" id="exportBtn">Export ↓</button>
</header>

<main>
  <div class="balance">
    <div class="label">Jelenlegi egyenleg</div>
    <div class="amount" id="balance">0 Ft</div>
    <div class="stats">
      <div class="stat"><span class="label">Bevétel ebben a hónapban</span><strong class="green" id="income">+0 Ft</strong></div>
      <div class="stat"><span class="label">Kiadás ebben a hónapban</span><strong class="red" id="expense">−0 Ft</strong></div>
    </div>
  </div>

  <div class="section-head"><h2>Legutóbbi tranzakciók</h2></div>
  <div id="recent"></div>
</main>

<button class="fab" id="fabBtn" aria-label="Új tranzakció">＋</button>

<!-- 1. ablak: összeg -->
<div class="backdrop" id="sheetAmount">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <div class="type-toggle" id="typeToggle">
      <button data-type="expense" class="active">− Kiadás</button>
      <button data-type="income">＋ Bevétel</button>
    </div>
    <input id="amountInput" class="amount-input" type="number" inputmode="numeric" min="1" step="1" autocomplete="off">
    <div class="amount-suffix">Mennyi az összeg?</div>
    <button class="btn" id="toCategory">Tovább</button>
    <button class="btn ghost" data-close>Mégse</button>
  </div>
</div>

<!-- 2. ablak: kategória -->
<div class="backdrop" id="sheetCategory">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="catTitle">Mire költötted?</h2>
    <div class="summary-line">
      <span class="lbl" id="summaryType">Kiadás</span>
      <span class="val" id="summaryAmount">0 Ft</span>
    </div>
    <div class="cat-grid" id="catGrid">
      <button class="cat-btn" data-cat="Kaja/Pia"><span class="ico">🍔</span>Kaja/Pia</button>
      <button class="cat-btn" data-cat="Szórakozás"><span class="ico">🎮</span>Szórakozás</button>
      <button class="cat-btn" data-cat="Játék"><span class="ico">🕹️</span>Játék</button>
      <button class="cat-btn" data-cat="Ruha"><span class="ico">👕</span>Ruha</button>
      <button class="cat-btn" data-cat="Adomány"><span class="ico">🎁</span>Adomány</button>
    </div>
    <label class="small" for="noteInput">Megjegyzés (nem kötelező)</label>
    <input id="noteInput" type="text" maxlength="90">
    <button class="btn" id="saveTx" disabled>Mentés</button>
    <button class="btn ghost" id="backToAmount">← Vissza</button>
  </div>
</div>

<script>
const KEY='penztaram.transactions.v1';
let transactions=load(KEY,[]), selectedType='expense', selectedCat=null;
const $=id=>document.getElementById(id);
function load(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}}
function save(){localStorage.setItem(KEY,JSON.stringify(transactions));render()}
function fmt(n){return new Intl.NumberFormat('hu-HU',{style:'currency',currency:'HUF',maximumFractionDigits:0}).format(n)}
function dateLocal(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function isThisMonth(t){return t.date.slice(0,7)===dateLocal().slice(0,7)}
function sum(type,arr=transactions){return arr.filter(t=>t.type===type).reduce((s,t)=>s+t.amount,0)}
function catIcon(c){return ({'Kaja/Pia':'🍔','Szórakozás':'🎮','Játék':'🕹️','Ruha':'👕','Adomány':'🎁'})[c]||'💸'}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function txHTML(t){return `<div class="card"><div class="tx"><div class="emoji">${catIcon(t.category)}</div><div class="txinfo"><strong>${escapeHTML(t.note||t.category)}</strong><small>${escapeHTML(t.category)} · ${t.date}</small></div><div class="txamt ${t.type==='income'?'green':'red'}">${t.type==='income'?'+':'−'}${fmt(t.amount)}<small><button class="smallbtn" onclick="removeTx('${t.id}')">Törlés</button></small></div></div></div>`}
function render(){
  const month=transactions.filter(isThisMonth);
  const inc=sum('income'),out=sum('expense');
  $('balance').textContent=fmt(inc-out);
  $('income').textContent='+'+fmt(sum('income',month));
  $('expense').textContent='−'+fmt(sum('expense',month));
  const sorted=[...transactions].sort((a,b)=>b.date.localeCompare(a.date)||b.created-a.created);
  $('recent').innerHTML=sorted.slice(0,20).map(txHTML).join('')||'<div class="card empty">Még nincs tranzakciód.<br>Nyomd meg a + gombot!</div>';
}
function removeTx(id){if(confirm('Törlöd ezt a tranzakciót?')){transactions=transactions.filter(t=>t.id!==id);save()}}

/* Ablakok kezelése */
function openAmount(){
  selectedType='expense'; selectedCat=null;
  document.querySelectorAll('#typeToggle button').forEach(b=>b.classList.toggle('active',b.dataset.type==='expense'));
  $('amountInput').value='';
  $('sheetCategory').classList.remove('show');
  $('sheetAmount').classList.add('show');
  setTimeout(()=>$('amountInput').focus(),180);
}
function closeAll(){$('sheetAmount').classList.remove('show');$('sheetCategory').classList.remove('show')}

$('fabBtn').addEventListener('click',openAmount);
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',closeAll));
document.querySelectorAll('.backdrop').forEach(b=>b.addEventListener('click',e=>{if(e.target===b)closeAll()}));

document.querySelectorAll('#typeToggle button').forEach(b=>b.addEventListener('click',()=>{
  selectedType=b.dataset.type;
  document.querySelectorAll('#typeToggle button').forEach(x=>x.classList.toggle('active',x===b));
}));

$('toCategory').addEventListener('click',()=>{
  const amt=Number($('amountInput').value);
  if(!Number.isFinite(amt)||amt<=0){$('amountInput').focus();return}
  $('summaryType').textContent=selectedType==='income'?'Bevétel':'Kiadás';
  $('summaryAmount').textContent=(selectedType==='income'?'+':'−')+fmt(amt);
  $('summaryAmount').className='val '+(selectedType==='income'?'green':'red');
  $('catTitle').textContent=selectedType==='income'?'Honnan jött?':'Mire költötted?';
  selectedCat=null;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('selected'));
  $('noteInput').value='';
  $('saveTx').disabled=true;
  $('sheetAmount').classList.remove('show');
  $('sheetCategory').classList.add('show');
});

$('backToAmount').addEventListener('click',()=>{$('sheetCategory').classList.remove('show');$('sheetAmount').classList.add('show')});

document.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{
  selectedCat=b.dataset.cat;
  document.querySelectorAll('.cat-btn').forEach(x=>x.classList.toggle('selected',x===b));
  $('saveTx').disabled=false;
}));

$('saveTx').addEventListener('click',()=>{
  const amt=Number($('amountInput').value);
  if(!Number.isFinite(amt)||amt<=0||!selectedCat)return;
  transactions.push({
    id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),
    type:selectedType,
    amount:amt,
    category:selectedCat,
    date:dateLocal(),
    note:$('noteInput').value.trim(),
    created:Date.now()
  });
  save();
  closeAll();
});

$('amountInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('toCategory').click()});

/* Export */
function download(name,content,type){const a=document.createElement('a'),url=URL.createObjectURL(new Blob([content],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('exportBtn').addEventListener('click',()=>{
  const rows=[['Típus','Összeg (Ft)','Kategória','Dátum','Megjegyzés'],...transactions.map(t=>[t.type==='income'?'Bevétel':'Kiadás',t.amount,t.category,t.date,t.note])];
  const csv=rows.map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
  download('penztaram-tranzakciok.csv','\ufeff'+csv,'text/csv;charset=utf-8');
});

$('today').textContent=new Date().toLocaleDateString('hu-HU',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
if('serviceWorker' in navigator && location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
render();
</script>
</body></html>
